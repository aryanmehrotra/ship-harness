name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version-bump check needs a merge-base with the target branch

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh collectors/*.sh hooks/*.sh install.sh test/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check the node collector
        run: node --check collectors/web-shots.mjs

      - name: Validate every shipped JSON
        run: |
          for f in $(find . -name '*.json' -not -path './node_modules/*'); do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      # plugin.json is the version Claude Code installs against. If it drifts from the
      # marketplace entry or the CHANGELOG, users auto-update into notes for other code.
      - name: Versions agree across plugin.json, marketplace.json and the CHANGELOG
        run: |
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          market=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          logged=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          if [ "$plugin" != "$market" ] || [ "$plugin" != "$logged" ]; then
            echo "plugin.json=$plugin marketplace.json=$market CHANGELOG=$logged"
            exit 1
          fi

      - name: Validate presets against the schema
        run: |
          npm i -g ajv-cli@5 >/dev/null 2>&1
          for p in templates/presets/*.json; do
            ajv validate -s schema/ship.config.schema.json -d "$p" --spec=draft7 --strict=false
          done

      # A surface change that forgets the bump ships to nobody: Claude Code caches by
      # version, so users keep running the old copy and no error ever says why.
      - name: Shipped surface changed ⇒ version bumped
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD \
            -- skills agents scripts collectors hooks templates schema | wc -l | tr -d ' ')
          if [ "$changed" -eq 0 ]; then echo "no surface change"; exit 0; fi
          now=$(jq -r '.version' .claude-plugin/plugin.json)
          was=$(git show "$base:.claude-plugin/plugin.json" | jq -r '.version')
          if [ "$now" = "$was" ]; then
            echo "$changed shipped file(s) changed but plugin.json is still $now"
            echo "bump the version, add a CHANGELOG section, and tag vX.Y.Z"
            exit 1
          fi
          grep -q "^## $now\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $now' section"; exit 1; }
          echo "$was -> $now, changelog present"

      - name: Test suite
        run: bash test/run.sh
